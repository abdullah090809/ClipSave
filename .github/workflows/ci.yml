name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mobile-ci:
    name: Mobile Frontend Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Mobile Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: TypeScript Strict Check
        run: npm run typecheck

      - name: Jest Test Suite
        run: npm test -- --ci --maxWorkers=2

  backend-ci:
    name: Backend Resolver Tests & Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          pytest -v backend/tests

      - name: Verify Docker Container Build
        run: |
          docker build -t clipsave-resolver:ci backend/
