name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select APK Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both

  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'backend/**'
      - 'README.md'
      - '.gitignore'

env:
  EXPO_PUBLIC_API_BASE_URL: https://clipsave-96518.containers.snapdeploy.app
  EXPO_PUBLIC_BACKEND_URL: https://clipsave-96518.containers.snapdeploy.app

jobs:
  build-apk:
    name: Build APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 5. Install Dependencies
        run: npm ci || npm install --legacy-peer-deps

      - name: 6. Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: 7. Configure APK Signing
        run: |
          cd android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Production keystore secret detected. Decoding release keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
          else
            echo "Notice: No production keystore secret (ANDROID_KEYSTORE_BASE64) detected."
            echo "Configuring debug signing for development/testing APK artifact..."
            if [ ! -f "debug.keystore" ]; then
              keytool -genkey -v -keystore debug.keystore \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            if grep -q "signingConfigs.release" build.gradle; then
              sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' build.gradle || true
            fi
          fi

      - name: 8. Build APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          echo "Selected build type: $BUILD_TYPE"
          
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          elif [ "$BUILD_TYPE" = "both" ]; then
            ./gradlew assembleRelease assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: 9. Collect Generated APKs
        run: |
          mkdir -p output-apks
          find android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} output-apks/ \;
          echo "Collected APK files:"
          ls -lh output-apks/

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipSave-Android-APK
          path: output-apks/*.apk
          retention-days: 14

      - name: 11. Generate GitHub Run Summary
        run: |
          echo "### 🚀 ClipSave Android APK Build Completed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The APK was compiled using GitHub Actions runners." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Generated Files:" >> $GITHUB_STEP_SUMMARY
          for apk in output-apks/*.apk; do
            filename=$(basename "$apk")
            filesize=$(du -h "$apk" | cut -f1)
            echo "- 📱 **$filename** (\`$filesize\`)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **How to download:** Scroll down to the **Artifacts** section at the bottom of this run summary page and click **ClipSave-Android-APK**." >> $GITHUB_STEP_SUMMARY
